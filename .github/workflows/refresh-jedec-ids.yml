# Keeps the SPI flash chip catalogue (Packages/UEFIImage/.../JedecIDs.swift)
# current: runs the `update-jedec-ids` skill's generator weekly and, only when
# the table changed and the package's tests still pass, opens a pull request
# for someone to read. Never a commit to main, never a PR with no diff.
#
# Needs "Allow GitHub Actions to create and approve pull requests" under
# Settings ▸ Actions ▸ General. A PR opened with GITHUB_TOKEN does not start
# other workflows, which is fine: this job already ran the tests.
name: Refresh flash chip catalogue

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the table
        run: python3 Skills/update-jedec-ids/scripts/gen_jedec.py

      - name: Stop when nothing changed
        id: diff
        run: |
          if git diff --quiet -- Packages/UEFIImage/Sources/UEFIImage/JedecIDs.swift; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A truncated read or a changed upstream layout fails here, or in the
      # generator's own floors above, and no PR is opened.
      - name: Test the package
        if: steps.diff.outputs.changed == 'true'
        run: swift test --package-path Packages/UEFIImage

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=automation/refresh-jedec-ids
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add Packages/UEFIImage/Sources/UEFIImage/JedecIDs.swift
          git commit -m "Refresh the flash chip catalogue from its sources"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$branch" --base main \
              --title "Refresh the flash chip catalogue" \
              --body "Regenerated by \`Skills/update-jedec-ids/scripts/gen_jedec.py\` (UEFITool, Linux SPI-NOR, flashrom). Read the diff: new chips appear as lines, a rename as a changed one; a diff that removes most of the file is a parse that went wrong. \`UEFIImage\` tests passed. If UEFITool's count changed, update \`testTheChipCatalogueIsComplete\` in this PR. Refs #25."
          fi
